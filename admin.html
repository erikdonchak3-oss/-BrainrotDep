<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071426"><title>BrainrotDep — Admin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#edf7ff;font:15px system-ui,Arial,sans-serif}
main{max-width:560px;margin:auto;padding:20px 16px 50px}.panel{background:#10233d;border:1px solid #244463;border-radius:16px;padding:16px;margin:14px 0}
h1{font-size:23px;margin:4px 0 8px}h2{font-size:17px;margin:0 0 12px}.muted{color:#91a9c5;font-size:13px}
input,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #31516d}
input{width:100%;background:#071a2e;color:#fff;margin:6px 0 10px}button{background:#0284c7;color:#00182b;font-weight:800;cursor:pointer;border:0}button.secondary{background:#173554;color:#d9f3ff;border:1px solid #2c6288}button.danger{background:#7f1d1d;color:#fff}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.player{line-height:1.7}.character{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid #244463}.character button{padding:7px 10px}.status{margin:10px 0;color:#67e8f9;white-space:pre-wrap}
</style></head>
<body><main>
<h1>🛠 BrainrotDep Admin</h1><p class="muted">Панель керування гравцями. Доступ перевіряється сервером за Telegram ID.</p>
<div id="status" class="status">Перевірка доступу…</div>
<section id="tools" hidden>
<div class="panel"><h2>Пошук гравця</h2><input id="playerId" inputmode="numeric" placeholder="Telegram ID гравця"><button id="search">Знайти</button></div>
<div id="playerPanel" hidden>
<div class="panel"><h2>Профіль гравця</h2><div id="profile" class="player"></div></div>
<div class="panel"><h2>Токени</h2><p class="muted">Додатне число — видати, від’ємне — забрати.</p><input id="tokenAmount" type="number" step="1" placeholder="Наприклад: 100 або -50"><button id="applyTokens">Застосувати</button></div>
<div class="panel"><h2>Видати персонажа</h2><input id="characterName" placeholder="Назва персонажа"><input id="characterRarity" placeholder="Рідкість (наприклад: Secret)"><button id="giveCharacter">Видати персонажа</button></div>
<div class="panel"><h2>Інвентар</h2><div id="characters"></div></div>
</div></section>
</main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const statusEl=document.getElementById('status'),tools=document.getElementById('tools'),panel=document.getElementById('playerPanel');
let currentId=null;
async function api(url,options={}){const r=await fetch(url,{...options,headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData||'',...(options.headers||{})}});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}
function say(s){statusEl.textContent=s}
async function loadPlayer(){if(!currentId)return;const p=await api('/api/admin/player/'+encodeURIComponent(currentId));panel.hidden=false;document.getElementById('profile').innerHTML=`<b>ID:</b> ${p.telegramId}<br><b>Ім’я:</b> ${escapeHtml(p.firstName||'—')}<br><b>Username:</b> ${p.username?'@'+escapeHtml(p.username):'—'}<br><b>Токени:</b> ${p.tokens}<br><b>Персонажів:</b> ${p.collection.length}<br><span class="muted">Оновлено: ${new Date(p.updatedAt).toLocaleString()}</span>`;document.getElementById('characters').innerHTML=p.collection.length?p.collection.map((c,i)=>`<div class="character"><span>${i+1}. ${escapeHtml(c.name||'Без назви')} <small class="muted">(${escapeHtml(c.rarity||'—')})</small></span><button class="danger" data-remove="${i}">Забрати</button></div>`).join(''):'<p class="muted">Інвентар порожній.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{try{await api(`/api/admin/player/${currentId}/characters/${b.dataset.remove}`,{method:'DELETE'});await loadPlayer();say('Персонажа забрано.')}catch(e){say(e.message)}})}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('search').onclick=async()=>{currentId=document.getElementById('playerId').value.trim();if(!/^\d{1,20}$/.test(currentId)){say('Введи коректний Telegram ID.');return}try{await loadPlayer();say('Гравця знайдено.')}catch(e){panel.hidden=true;say(e.message)}};
document.getElementById('applyTokens').onclick=async()=>{const amount=Number(document.getElementById('tokenAmount').value);if(!currentId||!Number.isSafeInteger(amount)||amount===0){say('Введи ціле ненульове число.');return}try{await api(`/api/admin/player/${currentId}/tokens`,{method:'PATCH',body:JSON.stringify({amount})});document.getElementById('tokenAmount').value='';await loadPlayer();say('Баланс оновлено.')}catch(e){say(e.message)}};
document.getElementById('giveCharacter').onclick=async()=>{const name=document.getElementById('characterName').value.trim(),rarity=document.getElementById('characterRarity').value.trim()||'Brainrot';if(!name||!currentId){say('Введи назву персонажа.');return}try{await api(`/api/admin/player/${currentId}/characters`,{method:'POST',body:JSON.stringify({name,rarity})});document.getElementById('characterName').value='';await loadPlayer();say('Персонажа видано.')}catch(e){say(e.message)}};
(async()=>{try{await api('/api/admin/me');tools.hidden=false;say('Доступ дозволено.');}catch(e){say('Доступ заборонено: '+e.message)}})();
</script></body></html>
